<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SkinMatch Beauty</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#FBF6F4;
  --surface:#FFFFFF;
  --ink:#2A2029;
  --ink-soft:#7A6A70;
  --ink-faint:#B7A9AE;
  --accent:#D6236F;
  --accent-dark:#A9105A;
  --accent-soft:#FCE6EF;
  --accent-soft-2:#F8D2E3;
  --line:#F1E3E8;
  --oil:#3E8FD1;      --oil-bg:#E7F1FB;
  --dry:#E0992B;      --dry-bg:#FBF0DD;
  --spots:#A855C9;    --spots-bg:#F3E6FA;
  --acne:#E0523E;     --acne-bg:#FBE7E3;
  --sens:#3FA772;     --sens-bg:#E5F5EC;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow:0 14px 34px -18px rgba(90,30,55,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#EFE6E2;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
button{font-family:inherit;}
#phone{
  width:100%;
  max-width:400px;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.screen{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding-bottom:90px;
  animation:fadeIn .35s ease;
}
.screen.no-nav{padding-bottom:28px;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 6px;
}
.topbar .brand{display:flex;align-items:center;gap:8px;}
.topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.topbar .brand span{font-family:'Plus Jakarta Sans';font-weight:800;font-size:15px;letter-spacing:.5px;}
.topbar .brand small{display:block;font-size:8px;letter-spacing:2px;color:var(--ink-faint);font-weight:600;margin-top:1px;}
.iconbtn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);
}
.backrow{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px;}

.content{flex:1;padding:0 20px;}

.btn-primary{
  width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;padding:16px;border-radius:32px;font-weight:700;font-size:15px;
  cursor:pointer;box-shadow:0 12px 22px -10px rgba(214,35,111,.55);
  transition:transform .15s ease;
}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
.btn-secondary{
  width:100%;background:var(--surface);color:var(--accent-dark);border:1.5px solid var(--accent-soft-2);
  padding:14px;border-radius:32px;font-weight:700;font-size:14px;cursor:pointer;
}
.btn-ghost{
  background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;
}

/* Progress dots (step indicator) */
.steps{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 0 18px;}
.steps .seg{height:3px;border-radius:3px;background:var(--line);flex:1;max-width:56px;transition:background .3s;}
.steps .seg.done{background:var(--accent);}

/* Home */
.hero-eyebrow{color:var(--accent);font-weight:700;font-size:15px;margin:4px 0 0;}
.hero-title{font-size:30px;line-height:1.15;font-weight:800;margin:2px 0 10px;}
.hero-sub{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0 0 22px;}
.hero-photo{
  position:relative;border-radius:24px;overflow:hidden;height:220px;
  background:linear-gradient(140deg,var(--accent-soft),#FDEDF3 60%, #F6E9DE);
  display:flex;align-items:flex-end;justify-content:center;margin-bottom:18px;
}
.hero-photo svg{width:100%;height:100%;}
.last-scan-card{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:16px;cursor:pointer;
}
.last-scan-ring{width:44px;height:44px;flex:none;}
.last-scan-card .lbl{font-size:11px;color:var(--ink-soft);font-weight:600;}
.last-scan-card .val{font-size:14px;font-weight:700;}

/* Question chips */
.q-title{font-size:22px;font-weight:800;margin:6px 0 4px;}
.q-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5;}
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px;}
.chip-grid.single{grid-template-columns:1fr;}
.chip{
  background:var(--surface);border:1.5px solid var(--line);border-radius:18px;
  padding:16px 14px;cursor:pointer;transition:.15s ease;display:flex;flex-direction:column;gap:10px;
}
.chip.single-row{flex-direction:row;align-items:center;gap:12px;}
.chip:active{transform:scale(.98);}
.chip.selected{border-color:var(--accent);background:var(--accent-soft);}
.chip .ic{width:30px;height:30px;}
.chip .lbl{font-size:13.5px;font-weight:700;line-height:1.25;}
.chip .desc{font-size:11.5px;color:var(--ink-soft);}

/* Camera screen */
.cam-title{font-size:21px;font-weight:800;text-align:center;margin:8px 0 2px;}
.cam-sub{font-size:13px;color:var(--ink-soft);text-align:center;margin:0 0 18px;}
.cam-frame{
  position:relative;width:100%;aspect-ratio:3/3.6;border-radius:26px;overflow:hidden;
  background:#EFE6E2;border:1px solid var(--line);margin-bottom:14px;
}
.cam-frame video, .cam-frame img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.face-guide{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
}
.face-guide svg{width:64%;opacity:.85;}
.cam-fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:24px;text-align:center;background:var(--surface);
}
.cam-fallback p{font-size:12.5px;color:var(--ink-soft);margin:0;line-height:1.5;}
.tip-row{display:flex;justify-content:space-between;margin-bottom:22px;}
.tip{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-soft);font-weight:600;flex:1;text-align:center;}
.tip .ic{width:22px;height:22px;color:var(--accent);}

/* Analyzing */
.ring-wrap{display:flex;justify-content:center;margin:18px 0 26px;position:relative;}
.ring-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;font-family:'Plus Jakarta Sans';}
.checklist{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 16px;}
.check-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line);}
.check-item:last-child{border-bottom:none;}
.check-item .mark{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;transition:.25s;}
.check-item.done .mark{background:var(--accent);border-color:var(--accent);}
.check-item.done{color:var(--ink);}
.check-item:not(.done){color:var(--ink-faint);}

/* Results */
.result-title{font-size:23px;font-weight:800;margin:8px 0 18px;}
.result-title .spark{color:var(--accent);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:18px;margin-bottom:14px;}
.card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 10px;font-weight:700;}
.profile-desc{font-size:14.5px;line-height:1.55;margin:0;font-weight:500;}
.need-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.need-row:last-child{border-bottom:none;}
.need-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.need-name{font-size:14px;font-weight:700;margin:0;}
.need-tag{font-size:11.5px;font-weight:600;margin:1px 0 0;}
.need-pct{font-size:15px;font-weight:800;font-family:'Plus Jakarta Sans';}
.metric-block{margin-bottom:18px;}
.metric-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.metric-head .left{display:flex;align-items:center;gap:8px;}
.metric-head .name{font-size:13.5px;font-weight:700;}
.metric-head .pct{font-size:13.5px;font-weight:800;}
.bar-track{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px;}
.bar-fill{height:100%;border-radius:8px;transition:width 1s cubic-bezier(.22,.9,.3,1);}
.metric-tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
.metric-tips li{font-size:12px;color:var(--ink-soft);padding-left:14px;position:relative;line-height:1.45;}
.metric-tips li:before{content:'';position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--ink-faint);}

/* Bottom nav */
.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:400px;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:10px 6px 18px;z-index:20;
}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-faint);cursor:pointer;font-size:9.5px;font-weight:700;flex:1;}
.navitem.active{color:var(--accent);}
.navitem svg{width:21px;height:21px;}
.navitem.scan-fab{position:relative;top:-16px;}
.navitem.scan-fab .fabcircle{
  width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px -8px rgba(214,35,111,.6);margin-bottom:2px;
}
.navitem.scan-fab .fabcircle svg{width:22px;height:22px;color:#fff;}
.navitem.scan-fab.active{color:var(--accent);}

/* Profile / history */
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans';font-weight:800;font-size:22px;color:var(--accent-dark);}
.profile-head{display:flex;align-items:center;gap:14px;margin:6px 0 20px;}
.profile-name{font-size:18px;font-weight:800;margin:0;}
.profile-meta{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}
.history-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;cursor:pointer;}
.history-ring{width:38px;height:38px;flex:none;}
.history-item .htitle{font-size:13.5px;font-weight:700;margin:0;}
.history-item .hdate{font-size:11.5px;color:var(--ink-soft);margin:2px 0 0;}
.history-item .hgo{margin-left:auto;color:var(--ink-faint);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.empty-state svg{width:52px;height:52px;color:var(--ink-faint);margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.5;margin:0 0 18px;}

/* Products */
.product-card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;align-items:center;}
.product-thumb{width:52px;height:52px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;}
.product-thumb svg{width:26px;height:26px;}
.product-info{flex:1;min-width:0;}
.product-name{font-size:13.5px;font-weight:700;margin:0 0 2px;}
.product-tag{font-size:11px;color:var(--ink-soft);margin:0;}
.product-price{font-size:13px;font-weight:800;color:var(--accent-dark);}
.heart-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.heart-btn.active{background:var(--accent-soft);border-color:var(--accent-soft-2);}
.heart-btn svg{width:16px;height:16px;}
.section-label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;margin:22px 0 12px;}
.section-label:first-child{margin-top:6px;}

/* onboarding name */
.onboard-wrap{display:flex;flex-direction:column;justify-content:center;flex:1;padding:0 26px;}
.onboard-wrap input{
  width:100%;border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;font-size:15px;
  font-family:inherit;margin:22px 0 10px;background:var(--surface);color:var(--ink);
}
.onboard-wrap input:focus{outline:none;border-color:var(--accent);}
.disclaimer{font-size:10.5px;color:var(--ink-faint);text-align:center;line-height:1.5;margin-top:14px;padding:0 6px;}
</style>
</head>
<body>
<div id="phone"><div id="app"></div></div>

<script>
/* ---------------- ICONS ---------------- */
const ic = {
  droplet:c=>`<svg viewBox="0 0 24 24" fill="none" class="ic"><path d="M12 3s7 7.6 7 12.2A7 7 0 1 1 5 15.2C5 10.6 12 3 12 3Z" stroke="${c}" stroke-width="1.8" fill="${c}22"/></svg>`,

  leaf:c=>`<svg viewBox="0 0 24 24" fill="none" class="ic"><path d="M5 19c0-8 5-13 14-13 0 9-5 13-14 13Z" stroke="${c}" stroke-width="1.8" fill="${c}22"/><path d="M6 18c3-3 6-6 12-11" stroke="${c}" stroke-width="1.6"/></svg>`,

  pore:c=>`<svg viewBox="0 0 24 24" fill="none" class="ic"><circle cx="7" cy="8" r="2" fill="${c}"/><circle cx="15" cy="7" r="1.6" fill="${c}" opacity=".75"/><circle cx="11" cy="13" r="2.2" fill="${c}" opacity=".9"/><circle cx="17" cy="15" r="1.8" fill="${c}" opacity=".65"/><circle cx="6" cy="16" r="1.5" fill="${c}" opacity=".55"/></svg>`,
  flame:c=>`<svg viewBox="0 0 24 24" fill="none" class="ic"><path d="M12 2c1 3-3 4-3 7.5A3.5 3.5 0 0 0 12 13a3 3 0 0 0 3-3c1.5 1.5 2 3 2 4.6A5.6 5.6 0 0 1 12 20a6 6 0 0 1-6-6c0-4 3-5.5 3-8 0-1.5.7-3 3-4Z" stroke="${c}" stroke-width="1.6" fill="${c}22"/></svg>`,
  alert:c=>`<svg viewBox="0 0 24 24" fill="none" class="ic"><path d="M12 3 2 20h20L12 3Z" stroke="${c}" stroke-width="1.8" fill="${c}18" stroke-linejoin="round"/><path d="M12 10v4" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.7" r="1" fill="${c}"/></svg>`,
  home:(c,f)=>`<svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-8.5Z" stroke="${c}" stroke-width="1.8" fill="${f||'none'}" stroke-linejoin="round"/></svg>`,
  scan:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 1-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 0-1 1h-3" stroke="${c}" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" stroke="${c}" stroke-width="1.8"/></svg>`,
  bag:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12l-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 8Z" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="${c}" stroke-width="1.8"/></svg>`,
  heart:(c,f)=>`<svg viewBox="0 0 24 24" fill="none"><path d="M12 20s-7.4-4.7-9.6-9A5 5 0 0 1 12 6.2 5 5 0 0 1 21.6 11c-2.2 4.3-9.6 9-9.6 9Z" stroke="${c}" stroke-width="1.8" fill="${f||'none'}"/></svg>`,
  user:c=>`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="${c}" stroke-width="1.8"/><path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  camera:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.4" stroke="${c}" stroke-width="1.8"/></svg>`,
  bulb:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M8 14a4 4 0 1 1 8 0c0 1.7-1 2.3-1.6 3.2-.3.5-.4.8-.4 1.3H10c0-.5-.1-.8-.4-1.3C9 16.3 8 15.7 8 14Z" stroke="${c}" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
  ban:c=>`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="${c}" stroke-width="1.7"/><path d="M6.5 6.5l11 11" stroke="${c}" stroke-width="1.7"/></svg>`,
  eye:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="${c}" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="${c}" stroke-width="1.7"/></svg>`,
  check:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17 19 7" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  chev:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  back:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  spark:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z" fill="${c}"/></svg>`,
  jar:c=>`<svg viewBox="0 0 24 24" fill="none"><rect x="6" y="9" width="12" height="11" rx="2" stroke="${c}" stroke-width="1.7"/><rect x="7.5" y="5" width="9" height="4" rx="1.5" stroke="${c}" stroke-width="1.7"/></svg>`,
  bottle:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M10 3h4v3.2l1.6 2.2c.3.4.4.9.4 1.4V19a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9.8c0-.5.1-1 .4-1.4L10 6.2V3Z" stroke="${c}" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
  tube:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8l1 4-3 4v9a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-9L7 7l1-4Z" stroke="${c}" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
  shield:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3Z" stroke="${c}" stroke-width="1.7" stroke-linejoin="round"/></svg>`,
  sparkles:c=>`<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z" fill="${c}"/></svg>`,
};

/* ---------------- DATA ---------------- */
const METRICS = [
  {key:'oleosidade', label:'Oleosidade', color:'var(--oil)', hex:'#3E8FD1', bg:'var(--oil-bg)', icon:'droplet'},

function handleFileUpload(evt){
  const file = evt.target.files[0];

  const reader = new FileReader();

    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width=160; canvas.height=160;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,160,160);
      state.scan.photo = canvas.toDataURL('image/jpeg',0.6);
      goTo('analyzing');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

const ANALYZE_ITEMS = ['Oleosidade','Hidratação','Textura','Manchas','Poros','Uniformidade','Vermelhidão'];
function renderAnalyzing(){
  return `<div class="screen no-nav" style="justify-content:center;">
    <div class="content">
      <h2 class="cam-title">Analisando sua pele...</h2>
      <p class="cam-sub">Isso pode levar alguns segundos.</p>
      <div class="ring-wrap">
        <svg viewBox="0 0 160 160" width="160" height="160">
          <circle cx="80" cy="80" r="66" fill="none" stroke="#F1E3E8" stroke-width="10"/>
          <circle id="progRing" cx="80" cy="80" r="66" fill="none" stroke="#D6236F" stroke-width="10" stroke-linecap="round" stroke-dasharray="${2*Math.PI*66}" stroke-dashoffset="${2*Math.PI*66}" transform="rotate(-90 80 80)"/>
        </svg>
        <div class="ring-pct" id="progPct">0%</div>
      </div>
      <div class="checklist" id="checklist">
        ${ANALYZE_ITEMS.map((t,i)=>`<div class="check-item" id="chk${i}"><span>${t}</span><div class="mark"></div></div>`).join('')}
      </div>
    </div>
  </div>`;
}
function runAnalysis(){
  const total = ANALYZE_ITEMS.length;
  const ring = document.getElementById('progRing');
  const pctEl = document.getElementById('progPct');
  const circumference = 2*Math.PI*66;
  let pct = 0;
  const duration = 3200;
  const start = Date.now();
  function tick(){
    const elapsed = Date.now()-start;
    pct = Math.min(100, Math.round((elapsed/duration)*100));
    if(ring){ ring.style.transition='stroke-dashoffset .1s linear'; ring.setAttribute('stroke-dashoffset', circumference - circumference*pct/100); }
    if(pctEl) pctEl.textContent = pct+'%';
    const doneCount = Math.floor((pct/100)*total);
    for(let i=0;i<total;i++){
      const el = document.getElementById('chk'+i);
      if(!el) continue;
      if(i<doneCount) el.classList.add('done'); 
    }
    for(let i=0;i<Math.min(doneCount,total);i++){
      const el = document.getElementById('chk'+i);
      if(el && el.classList.contains('done')){
        const mark = el.querySelector('.mark');
        if(mark && !mark.innerHTML) mark.innerHTML = ic.check('#fff');
      }
    }
    if(elapsed<duration && state.view==='analyzing'){
      requestAnimationFrame(tick);
    } else if(state.view==='analyzing'){
      for(let i=0;i<total;i++){
        const el = document.getElementById('chk'+i);
        if(el && !el.classList.contains('done')){ el.classList.add('done'); const m=el.querySelector('.mark'); if(m) m.innerHTML=ic.check('#fff'); }
      }
      setTimeout(finishAnalysis, 400);
    }
  }
  requestAnimationFrame(tick);
}
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function computeResults(){
  const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  let m = {oleosidade:rand(18,38), ressecamento:rand(18,38), manchas:rand(12,32), acne:rand(8,26), sensibilidade:rand(12,32)};
  state.scan.symptoms.forEach(id=>{
    const o = SYMPTOM_OPTS.find(x=>x.id===id);
    if(o && o.metric) m[o.metric] += o.boost;
  });
  const st = state.scan.skinType;
  if(st==='oleosa'){ m.oleosidade+=26; m.ressecamento-=14; }
  else if(st==='seca'){ m.ressecamento+=26; m.oleosidade-=14; }
  else if(st==='mista'){ m.oleosidade+=12; m.ressecamento+=6; }
  else if(st==='sensivel'){ m.sensibilidade+=28; }
  state.scan.concerns.forEach(id=>{
    const o = CONCERN_OPTS.find(x=>x.id===id);
    if(o && o.metric) m[o.metric] += o.boost;
  });
  if(state.scan.routine==='nenhuma'){ m.ressecamento+=8; m.sensibilidade+=8; }
  if(state.scan.routine==='ativos'){ m.sensibilidade+=10; }
  if(state.scan.routine==='protetor'){ m.manchas-=8; }
  Object.keys(m).forEach(k=> m[k]=clamp(Math.round(m[k]),5,97));

  let skinTypeLabel;
  const diff = m.oleosidade - m.ressecamento;
  if(diff>15) skinTypeLabel='Pele oleosa';
  else if(diff<-15) skinTypeLabel='Pele seca';
  else skinTypeLabel='Pele mista';
  if(m.sensibilidade>=65) skinTypeLabel += ' e sensível';

  const sorted = METRICS.map(mt=>({...mt, value:m[mt.key]})).sort((a,b)=>b.value-a.value);
  const top = sorted[0], second = sorted[1];
  const lowestNeed = [...sorted].sort((a,b)=>a.value-b.value)[sorted.length-1];
  const desc = `Pele com tendência à ${top.label.toLowerCase()} e necessidade de cuidado com ${second.label.toLowerCase()}.`;

  const overallScore = clamp(Math.round(100 - (Object.values(m).reduce((a,b)=>a+b,0)/5)*0.55), 42, 96);

  return {
    id: Date.now(),
    date: Date.now(),
    metrics: m,
    skinTypeLabel,
    description: desc,
    overallScore,
    photo: state.scan.photo,
  };
}
function finishAnalysis(){
  const result = computeResults();
  state.currentResult = result;
  state.history.push(result);
  saveHistory();
  goTo('results');
}

/* ---------------- RESULTS ---------------- */
function renderResults(res){
  if(!res) return renderHome();
  const sorted = METRICS.map(mt=>({...mt, value:res.metrics[mt.key]})).sort((a,b)=>b.value-a.value);
  const isCurrent = state.currentResult && state.currentResult.id===res.id && state.view==='results' && state.history[state.history.length-1] && state.history[state.history.length-1].id===res.id;
  return `<div class="screen">
    ${backBar(state._fromProfile? "goTo('profile')" : "goTo('home')")}
    <div class="content">
      <h2 class="result-title">${state._fromProfile? 'Resultado do scan' : 'Seu SkinMatch está pronto <span class="spark">✨</span>'.replace('<span class="spark">✨</span>', '')}${!state._fromProfile?' <span class="spark">'+ic.spark('#D6236F')+'</span>':''}</h2>
      <div class="card">
        <h3>Perfil da sua pele</h3>
        <p class="profile-desc">${esc(res.description)}</p>
      </div>
      <div class="card">
        <h3>Principais necessidades</h3>
        ${sorted.slice(0,4).map(mt=>{
          const prio = mt.value>=70?'Alta prioridade': mt.value>=40?'Média prioridade':'Manutenção';
          return `<div class="need-row">
            <div class="need-ic" style="background:${mt.bg}">${ic[mt.icon](mt.hex)}</div>
            <div><p class="need-name">${mt.label}</p><p class="need-tag" style="color:${mt.hex}">${prio}</p></div>
            <div class="need-pct" style="margin-left:auto;color:${mt.hex}">${mt.value}%</div>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <h3>Análise detalhada</h3>
        ${sorted.map(mt=>`
          <div class="metric-block">
            <div class="metric-head">
              <div class="left">${ic[mt.icon](mt.hex)}<span class="name">${mt.label}</span></div>
              <span class="pct" style="color:${mt.hex}">${mt.value}%</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${mt.value}%;background:${mt.hex}"></div></div>
            <ul class="metric-tips">${TREATMENTS[mt.key].slice(0,2).map(t=>`<li>${t}</li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>
      <button class="btn-primary" onclick="goTo('products')">VER MINHA ROTINA</button>
      <p class="disclaimer">Análise educativa gerada por questionário e foto. Não substitui avaliação dermatológica profissional.</p>
    </div>
    ${state._fromProfile? '' : bottomNav('results')}
  </div>`;
}
function viewHistoryEntry(id){
  const entry = state.history.find(h=>h.id===id);
  if(!entry) return;
  state._fromProfile = true;
  goTo('results', {currentResult:entry});
}

/* ---------------- PRODUCTS ---------------- */
function renderProducts(){
  const last = state.history[state.history.length-1];
  let recommended = PRODUCTS;
  let needLabel = '';
  if(last){
    const sorted = METRICS.map(mt=>({...mt, value:last.metrics[mt.key]})).sort((a,b)=>b.value-a.value);
    const topKeys = sorted.slice(0,2).map(m=>m.key);
    recommended = PRODUCTS.filter(p=>topKeys.includes(p.tag));
    needLabel = sorted[0].label;
  }
  const rest = PRODUCTS.filter(p=>!recommended.includes(p));
  return `<div class="screen">
    ${topBar()}
    <div class="content">
      <h2 class="q-title" style="margin-top:0">Produtos</h2>
      <p class="q-sub">${last ? `Selecionados para sua necessidade de ${needLabel.toLowerCase()}.` : 'Faça um Skin Scan para recomendações personalizadas.'}</p>
      ${recommended.length? `<p class="section-label">Recomendados para você</p>${recommended.map(productCard).join('')}` : ''}
      <p class="section-label">${recommended.length?'Outros produtos':'Todos os produtos'}</p>
      ${rest.map(productCard).join('')}
    </div>
    ${bottomNav('products')}
  </div>`;
}
function productCard(p){
  const fav = state.favorites.includes(p.id);
  return `<div class="product-card">
    <div class="product-thumb" style="background:${p.bg}">${ic[p.icon](p.color)}</div>
    <div class="product-info">
      <p class="product-name">${p.name}</p>
      <p class="product-tag">${METRICS.find(m=>m.key===p.tag)?.label || ''}</p>
      <p class="product-price">${p.price}</p>
    </div>
    <div class="heart-btn ${fav?'active':''}" onclick="toggleFavorite('${p.id}')">${ic.heart(fav?'#D6236F':'#7A6A70', fav?'#D6236F':'none')}</div>
  </div>`;
}
function toggleFavorite(id){
  const i = state.favorites.indexOf(id);
  if(i>-1) state.favorites.splice(i,1); else state.favorites.push(id);
  saveFavorites();
  render();
}

/* ---------------- FAVORITES ---------------- */
function renderFavorites(){
  const favProducts = PRODUCTS.filter(p=>state.favorites.includes(p.id));
  return `<div class="screen">
    ${topBar()}
    <div class="content">
      <h2 class="q-title" style="margin-top:0">Favoritos</h2>
      <p class="q-sub">Produtos que você salvou para depois.</p>
      ${favProducts.length ? favProducts.map(productCard).join('') : `
        <div class="empty-state">
          ${ic.heart('#B7A9AE')}
          <p>Você ainda não salvou nenhum produto.<br>Toque no coração de um produto para guardá-lo aqui.</p>
          <button class="btn-secondary" onclick="goTo('products')">Ver produtos</button>
        </div>`}
    </div>
    ${bottomNav('favorites')}
  </div>`;
}

/* ---------------- PROFILE ---------------- */
function renderProfile(){
  const initials = state.profile.name.trim().split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase();
  return `<div class="screen">
    ${topBar()}
    <div class="content">
      <div class="profile-head">
        <div class="avatar">${initials}</div>
        <div>
          <p class="profile-name">${esc(state.profile.name)}</p>
          <p class="profile-meta">${state.history.length} scan${state.history.length===1?'':'s'} realizado${state.history.length===1?'':'s'}</p>
        </div>
      </div>
      <p class="section-label" style="margin-top:0">Histórico de scans</p>
      ${state.history.length ? [...state.history].reverse().map(h=>`
        <div class="history-item" onclick="viewHistoryEntry(${h.id})">
          <div class="history-ring">${miniRing(h.overallScore,'#D6236F')}</div>
          <div><p class="htitle">${esc(h.skinTypeLabel)}</p><p class="hdate">${formatDate(h.date)}</p></div>
          <div class="hgo">${ic.chev('#B7A9AE')}</div>
        </div>
      `).join('') : `<div class="empty-state">
          ${ic.scan('#B7A9AE')}
          <p>Nenhum scan ainda.<br>Faça seu primeiro Skin Scan para começar a acompanhar sua pele.</p>
          <button class="btn-secondary" onclick="startScan()">Fazer meu Skin Scan</button>
        </div>`}
    </div>
    ${bottomNav('profile')}
  </div>`;
}

/* ---------------- POST-RENDER HOOKS ---------------- */
function afterRender(){
  if(state.view==='camera' && !state.cameraError){ initCamera(); }
  if(state.view==='analyzing'){ setTimeout(runAnalysis, 150); }
}

loadAll();
</script>
