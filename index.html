<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#232A2E">
<title>Shinmatch beaty — Análise de Pele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #FAF6F3;
  --panel: #FFFFFF;
  --ink: #232A2E;
  --ink-soft: #5B6469;
  --line: #E7DFD9;
  --rose: #E0836F;
  --rose-soft: #F4DCD4;
  --sage: #8CA084;
  --sage-soft: #E4EAE0;
  --gold: #C9A24B;
  --gold-soft: #F2E7CD;
  --navy: #2B3A4A;
  --navy-soft: #DDE3E8;
  --radius: 18px;
  --shadow: 0 8px 30px rgba(35,42,46,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Work Sans', sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-bottom:86px;}
h1,h2,h3{font-family:'Fraunces', serif; margin:0; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono', monospace;}
.eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft);}
.screen{padding:28px 22px 20px;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:100px;padding:16px 22px;font-family:'Work Sans';font-weight:600;font-size:15px;
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;width:100%;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ink); color:var(--bg);}
.btn-rose{background:var(--rose); color:#fff;}
.btn-outline{background:transparent;border:1.5px solid var(--line); color:var(--ink);}
.btn-ghost{background:transparent;color:var(--ink-soft);font-weight:500;}
.card{background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px;}
.field{width:100%;padding:15px 16px;border-radius:12px;border:1.5px solid var(--line);font-family:'Work Sans';font-size:15px;background:#fff;margin-top:8px;}
.field:focus{outline:none;border-color:var(--rose);}
.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:center;gap:12px;}
.spacer{flex:1;}
.pill{font-family:'IBM Plex Mono';font-size:11px;padding:5px 10px;border-radius:100px;background:var(--sage-soft);color:#4B5A44;font-weight:500;}
.pill-alert{background:var(--gold-soft);color:#7A6120;}
.pill-rose{background:var(--rose-soft); color:#93412E;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,246,243,0.9);backdrop-filter:blur(8px);padding:18px 22px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:30;}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--ink-soft);font-family:'IBM Plex Mono';font-size:10px;padding:6px 0;cursor:pointer;}
.navbtn.active{color:var(--rose);}
.navbtn svg{width:20px;height:20px;}
.progress-ring{position:relative;width:220px;height:220px;margin:0 auto;}
.fade-in{animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.scanwrap{position:relative;width:220px;height:220px;margin:24px auto;border-radius:50%;overflow:hidden;background:var(--navy);}
.scanwrap img{width:100%;height:100%;object-fit:cover;display:block;}
.scan-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(224,131,111,0.6);animation:pulse 1.8s ease-out infinite;}
.scan-ring.d2{animation-delay:.6s;}
.scan-ring.d3{animation-delay:1.2s;}
@keyframes pulse{0%{transform:scale(0.7);opacity:1;}100%{transform:scale(1.25);opacity:0;}}
.sweep{position:absolute;inset:0;background:conic-gradient(from 0deg, transparent 0deg, rgba(224,131,111,0.35) 40deg, transparent 90deg);animation:spin 1.6s linear infinite;border-radius:50%;}
@keyframes spin{to{transform:rotate(360deg);}}
.metric-bar{height:8px;border-radius:100px;background:var(--line);overflow:hidden;margin-top:8px;}
.metric-fill{height:100%;border-radius:100px;transition:width .8s ease;}
.upload-zone{border:1.5px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;background:#fff;}
input[type=file]{display:none;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:'IBM Plex Mono';font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--line);}
td{padding:10px 6px;border-bottom:1px solid var(--line);}
.disclaimer{background:var(--gold-soft);border-radius:14px;padding:14px 16px;font-size:12.5px;color:#5B4A1C;line-height:1.5;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--rose-soft);color:#93412E;display:flex;align-items:center;justify-content:center;font-family:'Fraunces';font-weight:600;font-size:15px;}
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.link{color:var(--rose);text-decoration:none;font-weight:600;font-size:13px;}
::selection{background:var(--rose-soft);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------
   DermaScan — protótipo funcional
   Análise de pele via câmera + heurística de processamento
   de imagem. NÃO é dispositivo médico certificado — serve
   como ferramenta de triagem/orientação, sempre reforçando
   o encaminhamento a um dermatologista.
--------------------------------------------------------- */

const state = {
  screen: 'splash',
  role: null,        // 'user' | 'admin'
  userName: null,
  navTab: 'home',
  lastResult: null,
  capturedImage: null,
  loading: false,
};

const ICONS = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>`,
  history: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  profile: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>`,
  admin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4" width="17" height="13" rx="2"/><path d="M8 20h8M12 17v3"/></svg>`,
  users: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M2.5 19a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.8 12.2a5 5 0 0 1 5.7 5.6"/></svg>`,
};

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const el = SCREENS[state.screen] ? SCREENS[state.screen]() : SCREENS.splash();
  app.appendChild(el);
}

function h(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function goto(screen){ state.screen = screen; render(); window.scrollTo(0,0); }

/* ---------------- Storage helpers ---------------- */
async function saveAnalysis(record){
  try{
    await window.storage.set('analyses:'+record.id, JSON.stringify(record), true);
    const idx = await safeGet('index:analyses', true);
    const list = idx ? JSON.parse(idx.value) : [];
    list.unshift(record.id);
    await window.storage.set('index:analyses', JSON.stringify(list), true);
  }catch(e){ console.error('save error', e); }
}
async function safeGet(key, shared){
  try{ return await window.storage.get(key, shared); }catch(e){ return null; }
}
async function getAllAnalyses(){
  const idx = await safeGet('index:analyses', true);
  if(!idx) return [];
  const ids = JSON.parse(idx.value);
  const results = [];
  for(const id of ids){
    const r = await safeGet('analyses:'+id, true);
    if(r) results.push(JSON.parse(r.value));
  }
  return results;
}
async function registerUser(name){
  try{
    const key = 'users:'+name.toLowerCase();
    const existing = await safeGet(key, true);
    if(!existing){
      await window.storage.set(key, JSON.stringify({name, createdAt:Date.now()}), true);
      const idx = await safeGet('index:users', true);
      const list = idx ? JSON.parse(idx.value) : [];
      if(!list.includes(name.toLowerCase())){ list.push(name.toLowerCase()); }
      await window.storage.set('index:users', JSON.stringify(list), true);
    }
  }catch(e){ console.error(e); }
}
async function getAllUsers(){
  const idx = await safeGet('index:users', true);
  if(!idx) return [];
  const keys = JSON.parse(idx.value);
  const out = [];
  for(const k of keys){
    const r = await safeGet('users:'+k, true);
    if(r) out.push(JSON.parse(r.value));
  }
  return out;
}

/* ---------------- Image analysis (heuristic) ---------------- */
function analyzeImageData(imgEl){
  const canvas = document.createElement('canvas');
  const size = 240;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgEl, 0, 0, size, size);
  const data = ctx.getImageData(0,0,size,size).data;

  const cols=24, rows=24;
  const cw = Math.floor(size/cols), ch = Math.floor(size/rows);
  let oily=0, dry=0, acne=0, sarda=0, total=0;
  let brightnessSum=0;

  for(let cy=0; cy<rows; cy++){
    for(let cx=0; cx<cols; cx++){
      let rs=0,gs=0,bs=0,n=0;
      let vals=[];
      for(let y=0;y<ch;y++){
        for(let x=0;x<cw;x++){
          const px = ((cy*ch+y)*size + (cx*cw+x))*4;
          if(px+2 >= data.length) continue;
          const r=data[px], g=data[px+1], b=data[px+2];
          rs+=r; gs+=g; bs+=b; n++;
          vals.push((r+g+b)/3);
        }
      }
      if(n===0) continue;
      const r=rs/n, g=gs/n, b=bs/n;
      const brightness = (r+g+b)/3/255;
      brightnessSum += brightness;
      const mean = vals.reduce((a,c)=>a+c,0)/vals.length;
      const variance = vals.reduce((a,c)=>a+(c-mean)*(c-mean),0)/vals.length;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      const sat = max===0 ? 0 : (max-min)/max;

      total++;
      // shine / oleosidade: muito claro, baixa saturação, baixa variância local
      if(brightness>0.72 && sat<0.28 && variance<180){ oily++; continue; }
      // acne: predominância avermelhada, saturação moderada-alta
      if(r-g>18 && r-b>22 && sat>0.22 && brightness<0.78 && brightness>0.28){ acne++; continue; }
      // sardas/manchas: tom castanho, mais escuro que a média local, saturação moderada
      if(r>g && g>=b && (r-b)>10 && (r-b)<40 && brightness<0.62 && brightness>0.25 && variance<260){ sarda++; continue; }
      // ressecamento: variância local alta (textura irregular), brilho médio-baixo
      if(variance>320 && brightness<0.68){ dry++; continue; }
    }
  }

  const pct = (n)=> total? Math.round((n/total)*100) : 0;
  const oleosidade = pct(oily);
  const ressecamento = pct(dry);
  const acnePct = pct(acne);
  const sardaPct = pct(sarda);
  const avgBrightness = Math.round((brightnessSum/total)*100);

  let tipo = 'Normal / Equilibrada';
  if(oleosidade>=22 && ressecamento>=14) tipo='Mista';
  else if(oleosidade>=22) tipo='Oleosa';
  else if(ressecamento>=18) tipo='Seca';

  let acneNivel = 'Baixo';
  if(acnePct>=18) acneNivel='Alto';
  else if(acnePct>=8) acneNivel='Moderado';

  let sardaNivel = 'Baixo';
  if(sardaPct>=16) sardaNivel='Alto';
  else if(sardaPct>=7) sardaNivel='Moderado';

  return { oleosidade, ressecamento, acnePct, acneNivel, sardaPct, sardaNivel, tipo, avgBrightness };
}

function treatmentFor(result){
  const tips = [];
  if(result.tipo==='Oleosa'){
    tips.push('Limpador facial em gel com pH balanceado, 2x ao dia.');
    tips.push('Hidratante oil-free ou em gel, não comedogênico.');
    tips.push('Ativos como niacinamida ou ácido salicílico em baixa concentração podem ajudar no controle de oleosidade.');
  } else if(result.tipo==='Seca'){
    tips.push('Limpador cremoso, sem sulfatos agressivos.');
    tips.push('Hidratante rico em ceramidas e ácido hialurônico, 2x ao dia.');
    tips.push('Evitar esfoliações físicas frequentes; preferir esfoliação química suave.');
  } else if(result.tipo==='Mista'){
    tips.push('Rotina diferenciada por região do rosto (zona T x bochechas).');
    tips.push('Hidratante leve em gel-creme.');
  } else {
    tips.push('Rotina de manutenção: limpeza suave + hidratação leve.');
  }
  if(result.acneNivel!=='Baixo'){
    tips.push('Evitar espremer lesões; considerar ativos como peróxido de benzoíla ou adapaleno, sob orientação médica.');
  }
  if(result.sardaNivel!=='Baixo'){
    tips.push('Uso diário de protetor solar FPS 50+ é essencial para não escurecer as manchas.');
    tips.push('Ativos clareadores (vitamina C, ácido tranexâmico) podem ser indicados por um dermatologista.');
  }
  tips.push('Protetor solar diário, independente do tipo de pele.');
  return tips;
}

/* ---------------- Screens ---------------- */
const SCREENS = {};

SCREENS.splash = function(){
  const el = h(`
    <div class="screen fade-in" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh;text-align:center;">
      <div style="width:96px;height:96px;border-radius:50%;background:var(--navy);margin:0 auto 22px;position:relative;overflow:hidden;">
        <div class="sweep" style="border-radius:50%;"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F4DCD4" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
        </div>
      </div>
      <div class="eyebrow" style="margin-bottom:6px;">Triagem dermatológica assistida</div>
      <h1 style="font-size:34px;">Skinmatch beauty</h1>
      <p style="color:var(--ink-soft);margin-top:10px;font-size:14.5px;line-height:1.55;padding:0 8px;">
        Aponte a câmera, entenda sua pele e receba orientações — sempre com o dermatologista no centro do cuidado.
      </p>
      <div style="margin-top:36px;" class="stack">
        <button class="btn btn-primary" onclick="chooseRole('user')">Entrar como Usuário</button>
        <button class="btn btn-outline" onclick="chooseRole('admin')">Entrar como Administrador</button>
      </div>
    </div>
  `);
  return el;
};

window.chooseRole = function(role){
  state.role = role;
  goto(role==='admin' ? 'adminLogin' : 'userLogin');
};

SCREENS.userLogin = function(){
  const el = h(`
    <div class="screen fade-in" style="padding-top:60px;">
      <div class="eyebrow">Perfil de usuário</div>
      <h2 style="font-size:26px;margin-top:6px;">Como podemos te chamar?</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:8px;">Seu nome identifica seu histórico de análises no app.</p>
      <input id="nameInput" class="field" placeholder="Seu nome" style="margin-top:22px;">
      <button class="btn btn-rose" style="margin-top:16px;" onclick="submitUserLogin()">Continuar</button>
      <button class="btn btn-ghost" onclick="goto('splash')">Voltar</button>
    </div>
  `);
  return el;
};
window.submitUserLogin = async function(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val){ shake('nameInput'); return; }
  state.userName = val;
  await registerUser(val);
  goto('userHome');
};

SCREENS.adminLogin = function(){
  const el = h(`
    <div class="screen fade-in" style="padding-top:60px;">
      <div class="eyebrow">Perfil administrador</div>
      <h2 style="font-size:26px;margin-top:6px;">Acesso restrito</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:8px;">Painel de acompanhamento das análises realizadas na clínica.</p>
      <input id="adminUser" class="field" placeholder="Usuário administrador" style="margin-top:22px;">
      <input id="adminPass" type="password" class="field" placeholder="Senha (demo: admin123)">
      <button class="btn btn-primary" style="margin-top:16px;" onclick="submitAdminLogin()">Entrar</button>
      <button class="btn btn-ghost" onclick="goto('splash')">Voltar</button>
    </div>
  `);
  return el;
};
window.submitAdminLogin = function(){
  const pass = document.getElementById('adminPass').value;
  const user = document.getElementById('adminUser').value.trim() || 'Administrador';
  if(pass !== 'admin123'){ shake('adminPass'); return; }
  state.userName = user;
  goto('adminHome');
};

function shake(id){
  const elm = document.getElementById(id);
  elm.style.borderColor = '#C0453A';
  elm.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:280});
}

/* ---- USER: Home / Capture ---- */
SCREENS.userHome = function(){
  const el = h(`
    <div>
      <div class="topbar">
        <div class="avatar">${(state.userName||'?')[0].toUpperCase()}</div>
        <div>
          <div class="eyebrow">Olá,</div>
          <div style="font-family:'Fraunces';font-weight:600;font-size:16px;">${state.userName}</div>
        </div>
      </div>
      <div class="screen">
        <div class="card" style="background:linear-gradient(135deg,var(--navy),#3A4C5F);color:#fff;">
          <div class="eyebrow" style="color:#B9C6D1;">Nova análise</div>
          <h2 style="color:#fff;font-size:22px;margin-top:6px;">Vamos escanear sua pele</h2>
          <p style="color:#D7DFE5;font-size:13px;margin-top:8px;line-height:1.5;">
            Use boa iluminação natural, rosto limpo e sem maquiagem para um resultado mais fiel.
          </p>
          <div class="row" style="margin-top:18px;gap:10px;">
            <button class="btn btn-rose" onclick="document.getElementById('cameraInput').click()">📷 Usar câmera</button>
          </div>
          <input type="file" id="cameraInput" accept="image/*" capture="user" onchange="handleImageSelected(event)">
        </div>

        <div class="divider"></div>
        <div class="eyebrow">Últimas análises</div>
        <div id="recentList" style="margin-top:12px;" class="stack">Carregando…</div>
      </div>
    </div>
  `);
  loadRecentForUser(el);
  return el;
};

async function loadRecentForUser(el){
  const all = await getAllAnalyses();
  const mine = all.filter(a=>a.userName===state.userName).slice(0,3);
  const container = el.querySelector('#recentList');
  if(!container) return;
  if(mine.length===0){
    container.innerHTML = `<div class="card empty" style="padding:26px;">Nenhuma análise ainda. Faça a primeira acima ↑</div>`;
    return;
  }
  container.innerHTML = mine.map(a=>`
    <div class="card row" style="padding:14px 16px;">
      <img src="${a.image}" style="width:44px;height:44px;border-radius:10px;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">${a.result.tipo}</div>
        <div class="eyebrow">${new Date(a.timestamp).toLocaleDateString('pt-BR')}</div>
      </div>
      <span class="pill">${a.result.acneNivel!=='Baixo' ? 'Acne '+a.result.acneNivel : 'Estável'}</span>
    </div>
  `).join('');
}

window.handleImageSelected = function(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    state.capturedImage = e.target.result;
    goto('analyzing');
  };
  reader.readAsDataURL(file);
};

/* ---- USER: Analyzing (signature scan animation) ---- */
SCREENS.analyzing = function(){
  const el = h(`
    <div class="screen fade-in" style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;">
      <div class="scanwrap">
        <img src="${state.capturedImage}">
        <div class="sweep"></div>
        <div class="scan-ring"></div>
        <div class="scan-ring d2"></div>
        <div class="scan-ring d3"></div>
      </div>
      <div style="text-align:center;margin-top:14px;">
        <div class="eyebrow">Analisando</div>
        <div id="scanLabel" class="mono" style="margin-top:6px;font-size:13px;color:var(--ink-soft);">Lendo textura e tom de pele…</div>
      </div>
    </div>
  `);
  const labels = ['Lendo textura e tom de pele…','Detectando brilho e oleosidade…','Mapeando possíveis manchas…','Calculando recomendações…'];
  let i=0;
  const interval = setInterval(()=>{
    i = (i+1) % labels.length;
    const lbl = el.querySelector('#scanLabel');
    if(lbl) lbl.textContent = labels[i]; else clearInterval(interval);
  }, 700);

  setTimeout(async ()=>{
    clearInterval(interval);
    const img = new Image();
    img.onload = async ()=>{
      const result = analyzeImageData(img);
      const record = {
        id: 'a_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
        userName: state.userName,
        timestamp: Date.now(),
        image: state.capturedImage,
        result
      };
      state.lastResult = record;
      await saveAnalysis(record);
      goto('results');
    };
    img.src = state.capturedImage;
  }, 2600);

  return el;
};

/* ---- USER: Results ---- */
SCREENS.results = function(){
  const r = state.lastResult.result;
  const tips = treatmentFor(r);
  const bar = (val, color)=>`<div class="metric-bar"><div class="metric-fill" style="width:${val}%;background:${color};"></div></div>`;
  const el = h(`
    <div class="screen fade-in">
      <div class="row">
        <button class="btn-ghost" style="width:auto;padding:6px;" onclick="goto('userHome')">← Início</button>
      </div>
      <div class="card" style="text-align:center;margin-top:10px;">
        <img src="${state.lastResult.image}" style="width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--rose-soft);">
        <div class="eyebrow" style="margin-top:14px;">Resultado da análise</div>
        <h2 style="font-size:26px;margin-top:4px;">${r.tipo}</h2>
      </div>

      <div class="card" style="margin-top:16px;">
        <div class="stack">
          <div>
            <div class="row"><span style="font-size:13.5px;font-weight:600;">Oleosidade</span><span class="spacer"></span><span class="mono" style="font-size:12px;">${r.oleosidade}%</span></div>
            ${bar(r.oleosidade,'var(--gold)')}
          </div>
          <div>
            <div class="row"><span style="font-size:13.5px;font-weight:600;">Ressecamento</span><span class="spacer"></span><span class="mono" style="font-size:12px;">${r.ressecamento}%</span></div>
            ${bar(r.ressecamento,'var(--navy)')}
          </div>
          <div>
            <div class="row"><span style="font-size:13.5px;font-weight:600;">Sinais de acne</span><span class="spacer"></span><span class="pill ${r.acneNivel!=='Baixo'?'pill-rose':''}">${r.acneNivel}</span></div>
            ${bar(r.acnePct,'var(--rose)')}
          </div>
          <div>
            <div class="row"><span style="font-size:13.5px;font-weight:600;">Sardas / manchas</span><span class="spacer"></span><span class="pill ${r.sardaNivel!=='Baixo'?'pill-alert':''}">${r.sardaNivel}</span></div>
            ${bar(r.sardaPct,'#B08D3E')}
          </div>
        </div>
      </div>

      <div class="divider"></div>
      <div class="eyebrow">Rotina sugerida</div>
      <div class="card" style="margin-top:10px;">
        <ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.9;color:var(--ink);">
          ${tips.map(t=>`<li>${t}</li>`).join('')}
        </ul>
      </div>

      <div class="disclaimer" style="margin-top:16px;">
        ⚠️ Esta análise é uma estimativa gerada por processamento de imagem, não um diagnóstico médico.
        Para confirmação e tratamento adequado, consulte sempre um <strong>dermatologista</strong>.
      </div>

      <button class="btn btn-primary" style="margin-top:20px;" onclick="goto('userHome')">Concluir</button>
    </div>
  `);
  return el;
};

/* ---- USER: History ---- */
SCREENS.userHistory = function(){
  const el = h(`
    <div>
      <div class="topbar"><h2 style="font-size:19px;">Histórico</h2></div>
      <div class="screen" id="histWrap"><div class="empty">Carregando…</div></div>
    </div>
  `);
  (async()=>{
    const all = await getAllAnalyses();
    const mine = all.filter(a=>a.userName===state.userName);
    const wrap = el.querySelector('#histWrap');
    if(mine.length===0){ wrap.innerHTML = `<div class="empty">Nenhuma análise registrada ainda.</div>`; return; }
    wrap.innerHTML = mine.map(a=>`
      <div class="card row" style="margin-bottom:12px;padding:14px 16px;" onclick='openHistoryItem(${JSON.stringify(a.id)})'>
        <img src="${a.image}" style="width:50px;height:50px;border-radius:12px;object-fit:cover;">
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14.5px;">${a.result.tipo}</div>
          <div class="eyebrow">${new Date(a.timestamp).toLocaleString('pt-BR')}</div>
        </div>
        <span class="pill ${a.result.acneNivel!=='Baixo'?'pill-rose':''}">Acne: ${a.result.acneNivel}</span>
      </div>
    `).join('');
    window._histCache = mine;
  })();
  return el;
};
window.openHistoryItem = function(id){
  const item = (window._histCache||[]).find(a=>a.id===id);
  if(!item) return;
  state.lastResult = item;
  goto('results');
};

/* ---- USER: Profile ---- */
SCREENS.userProfile = function(){

      <div class="screen">
        <div class="card" style="text-align:center;">
          <div class="avatar" style="width:64px;height:64px;font-size:24px;margin:0 auto;">${(state.userName||'?')[0].toUpperCase()}</div>

        <div class="disclaimer" style="margin-top:16px;">

        <button class="btn btn-outline" style="margin-top:20px;" onclick="logout()">Sair</button>

window.logout = function(){
  state.role=null; state.userName=null; state.lastResult=null; state.capturedImage=null; state.navTab='home';

};

/* ---- ADMIN: Home / Dashboard ---- */
SCREENS.adminHome = function(){
  const el = h(`
    <div>
      <div class="topbar">
        <div class="avatar" style="background:var(--navy-soft);color:var(--navy);">${ICONS.admin}</div>
        <div>
          <div class="eyebrow">Painel administrativo</div>

async function loadAdminData(el){
  const all = await getAllAnalyses();
  const users = await getAllUsers();
  const statsWrap = el.querySelector('#statsWrap');
  const acneAlto = all.filter(a=>a.result.acneNivel==='Alto').length;
  statsWrap.innerHTML = `
    <div class="card" style="flex:1;text-align:center;padding:16px 8px;">
      <div class="mono" style="font-size:22px;font-weight:600;">${users.length}</div>
      <div class="eyebrow" style="margin-top:4px;">Usuários</div>
    </div>
    <div class="card" style="flex:1;text-align:center;padding:16px 8px;">
      <div class="mono" style="font-size:22px;font-weight:600;">${all.length}</div>
      <div class="eyebrow" style="margin-top:4px;">Análises</div>
    </div>
    <div class="card" style="flex:1;text-align:center;padding:16px 8px;">
      <div class="mono" style="font-size:22px;font-weight:600;color:var(--rose);">${acneAlto}</div>
      <div class="eyebrow" style="margin-top:4px;">Acne alta</div>
    </div>
  `;
  const list = el.querySelector('#adminList');
  if(all.length===0){ list.innerHTML = `<div class="card empty">Nenhuma análise registrada ainda.</div>`; return; }
  list.innerHTML = all.slice(0,12).map(a=>`
    <div class="card row" style="padding:12px 14px;">
      <img src="${a.image}" style="width:42px;height:42px;border-radius:10px;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-weight:600;font-size:13.5px;">${a.userName}</div>
        <div class="eyebrow">${a.result.tipo} · ${new Date(a.timestamp).toLocaleDateString('pt-BR')}</div>
      </div>
      <span class="pill ${a.result.acneNivel!=='Baixo'?'pill-rose':''}">${a.result.acneNivel}</span>
    </div>
  `).join('');
}

/* ---- ADMIN: Users list ---- */
SCREENS.adminUsers = function(){
  const el = h(`
    <div>
      <div class="topbar"><h2 style="font-size:19px;">Usuários</h2></div>
      <div class="screen" id="adminUsersWrap"><div class="empty">Carregando…</div></div>
    </div>
  `);
  (async()=>{
    const users = await getAllUsers();

SCREENS.adminProfile = function(){
  const el = h(`

          <div class="eyebrow" style="margin-top:4px;">Administrador</div>

          O painel administrativo permite acompanhar o volume de análises e identificar usuários que podem precisar de encaminhamento prioritário a um dermatologista parceiro.

        <button class="btn btn-outline" style="margin-top:14px;" onclick="logout()">Sair</button>
      </div>

  `);

/* ---------------- Bottom nav ---------------- */
function withNav(screenEl, tabs, activeKey){
  const wrapper = document.createElement('div');
  wrapper.appendChild(screenEl);
  const nav = h(`<div class="bottomnav">${tabs.map(t=>`
    <button class="navbtn ${t.key===activeKey?'active':''}" onclick="goto('${t.screen}')">
      ${ICONS[t.icon]}<span>${t.label}</span>
    </button>`).join('')}</div>`);
  wrapper.appendChild(nav);
  return wrapper;
}

const originalGoto = goto;
goto = function(screen){
  state.screen = screen;
  const app = document.getElementById('app');
  app.innerHTML = '';
  let content = SCREENS[screen] ? SCREENS[screen]() : SCREENS.splash();

  const userTabs = [
    {key:'home', label:'Início', icon:'home', screen:'userHome'},
    {key:'history', label:'Histórico', icon:'history', screen:'userHistory'},
    {key:'profile', label:'Perfil', icon:'profile', screen:'userProfile'},
  ];
  const adminTabs = [
    {key:'home', label:'Painel', icon:'home', screen:'adminHome'},
    {key:'users', label:'Usuários', icon:'users', screen:'adminUsers'},
    {key:'profile', label:'Conta', icon:'profile', screen:'adminProfile'},
  ];

  if(['userHome','userHistory','userProfile'].includes(screen)){
    const map = {userHome:'home', userHistory:'history', userProfile:'profile'};
    content = withNav(content, userTabs, map[screen]);
  } else if(['adminHome','adminUsers','adminProfile'].includes(screen)){
    const map = {adminHome:'home', adminUsers:'users', adminProfile:'profile'};
    content = withNav(content, adminTabs, map[screen]);
  }
  app.appendChild(content);
  window.scrollTo(0,0);
};

goto('splash');
</script>
